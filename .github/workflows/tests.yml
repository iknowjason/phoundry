name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The runtime deps pull in the Agent Framework and Azure SDKs, which the
      # deterministic test suite does not import. Install only what the tests need,
      # so CI does not depend on a pre-release package resolving.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic python-dotenv httpx tenacity

      - name: Run tests
        run: pytest -q
